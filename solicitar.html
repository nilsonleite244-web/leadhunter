<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hunter Leads — Solicitar Acesso Gratuito</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#08080f;
    color:#eeeef2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:#111120;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:40px 36px;
    width:100%;
    max-width:420px;
    box-shadow:0 24px 80px rgba(0,0,0,.6);
  }
  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .logo-icon{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(135deg,#f09030,#e06818);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .logo-name{font-size:18px;font-weight:800;letter-spacing:-.5px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;line-height:1.2}
  .sub{font-size:14px;color:#8888a0;margin-bottom:28px;line-height:1.5}
  .highlight{color:#f09030}
  .badge-row{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
  .badge{
    background:rgba(240,144,48,.08);border:1px solid rgba(240,144,48,.2);
    color:#f5b455;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;
  }
  label{display:block;font-size:12px;font-weight:600;color:#8888a0;margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
  input{
    width:100%;padding:11px 14px;
    background:#0d0d18;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    color:#eeeef2;font-size:14px;font-family:inherit;
    outline:none;transition:border .15s;
    margin-bottom:16px;
  }
  input:focus{border-color:rgba(240,144,48,.5)}
  input::placeholder{color:#44445a}
  .btn{
    width:100%;padding:13px;
    background:linear-gradient(135deg,#f09030,#e06818);
    color:#000;font-size:15px;font-weight:800;
    border:none;border-radius:10px;cursor:pointer;
    transition:opacity .15s,transform .1s;
    letter-spacing:-.2px;
  }
  .btn:hover{opacity:.9}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{
    display:none;margin-top:16px;
    padding:12px 16px;border-radius:10px;
    font-size:13px;line-height:1.5;
  }
  .msg.success{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:#4ade80}
  .msg.error{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);color:#f87171}
  .footer{font-size:11px;color:#44445a;margin-top:24px;text-align:center;line-height:1.5}
  .footer a{color:#8888a0;text-decoration:none}
  .footer a:hover{color:#eeeef2}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🦊</div>
    <div class="logo-name">Hunter Leads</div>
  </div>

  <h1>Solicite seu <span class="highlight">acesso gratuito</span></h1>
  <p class="sub">Preencha abaixo e entraremos em contato com seu acesso em breve.</p>

  <div class="badge-row">
    <span class="badge">✓ 150 leads/dia</span>
    <span class="badge">✓ 7 dias grátis</span>
    <span class="badge">✓ Sem cartão</span>
  </div>

  <div id="form-wrap">
    <label for="inp-nome">Seu nome</label>
    <input id="inp-nome" type="text" placeholder="João Silva" autocomplete="name">

    <label for="inp-email">Seu melhor email *</label>
    <input id="inp-email" type="email" placeholder="joao@email.com" autocomplete="email">

    <button class="btn" id="btn-enviar" onclick="solicitar()">Solicitar acesso gratuito →</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="footer">
    Já tem acesso? <a href="https://leadhunter-vert.vercel.app">Entrar no sistema →</a>
  </div>
</div>

<script>
const API = 'https://leadhunter-production-bb4c.up.railway.app';

async function solicitar() {
  const nome  = document.getElementById('inp-nome').value.trim();
  const email = document.getElementById('inp-email').value.trim();
  const btn   = document.getElementById('btn-enviar');
  const msg   = document.getElementById('msg');

  msg.style.display = 'none';

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg('Por favor, informe um email válido.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const r = await fetch(`${API}/trial/solicitar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, email })
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      document.getElementById('form-wrap').style.display = 'none';
      showMsg('✅ Solicitação enviada! Assim que for aprovada você receberá um email com seu acesso. Fique de olho na caixa de entrada (e no spam).', 'success');
    } else {
      showMsg(d.error || 'Erro ao enviar. Tente novamente.', 'error');
      btn.disabled = false;
      btn.textContent = 'Solicitar acesso gratuito →';
    }
  } catch {
    showMsg('Erro de conexão. Verifique sua internet e tente novamente.', 'error');
    btn.disabled = false;
    btn.textContent = 'Solicitar acesso gratuito →';
  }
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') solicitar();
});
</script>
</body>
</html>
